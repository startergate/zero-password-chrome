<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>테스트: 로그인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="index.html">← 목록</a></nav>
  <h1>로그인</h1>
  <p class="expect">기대 결과: <strong>login</strong> · not_found (localhost 는 규칙을 조회할 수 없는 호스트)</p>
  <form action="/login" method="post" onsubmit="event.preventDefault()">
    <label>이메일 <input type="email" name="email" autocomplete="username"></label>
    <label>비밀번호 <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">로그인</button>
  </form>
</body>
</html>
