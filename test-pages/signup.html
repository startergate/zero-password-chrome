<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>테스트: 회원가입</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="index.html">← 목록</a></nav>
  <h1>회원가입</h1>
  <p class="expect">기대 결과: 두 비밀번호 칸 모두 <strong>signup</strong> (규칙 조회 없음, 배지에 조회 결과가 붙지 않음)</p>
  <form action="/signup" method="post" onsubmit="event.preventDefault()">
    <label>이메일 <input type="email" name="email" autocomplete="email"></label>
    <label>비밀번호 <input type="password" name="password" autocomplete="new-password"></label>
    <label>비밀번호 확인 <input type="password" name="password_confirm" autocomplete="new-password"></label>
    <button type="submit">회원가입</button>
  </form>
</body>
</html>
